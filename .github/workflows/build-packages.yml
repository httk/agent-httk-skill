name: Build packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and build packages
        run: make ci

      - name: Upload installable ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: httk-packages
          path: dist/*.zip
          if-no-files-found: error
