name: Build packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and build packages
        run: make ci

      - name: Upload standalone skill ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/httk-skill.zip
          archive: false
          if-no-files-found: error

      - name: Upload OpenAI plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/httk-plugin.zip
          archive: false
          if-no-files-found: error

      - name: Upload Claude plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/httk-claude-plugin.zip
          archive: false
          if-no-files-found: error

      - name: Upload Agent Plugins ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/httk-agent-plugin.zip
          archive: false
          if-no-files-found: error
